# Runtime sweep for eigenvector centrality: every family at five sizes, one seed.
# Run: PYTHONPATH=src .venv/bin/python experiments/run.py experiments/configs/time_complexity.yaml
# Writes results/raw/time_complexity.csv.

seeds: [0]
algorithms: [eigen_centrality]   # omit to run every registered algorithm

families:
  path: [10, 100, 200, 300, 500]
  star: [10, 100, 200, 300, 500]
  grid: [10, 100, 200, 300, 500]
  spider: [10, 100, 200, 300, 500]
  centipede: [10, 100, 200, 300, 500]
  barbell: [10, 100, 200, 300, 500]
  cluster: [10, 100, 200, 300, 500]
  scale_free: [10, 100, 200, 300, 500]
  small_world: [10, 100, 200, 300, 500]
  dary_tree: [10, 100, 200, 300, 500]
